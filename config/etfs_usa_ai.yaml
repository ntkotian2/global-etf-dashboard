# USA-listed AI ETFs, end-to-end across the AI value chain: pure-play AI/
# robotics funds plus the physical buildout (chips, data centers/networking,
# power). ticker must match the yfinance symbol (US tickers need no suffix).
# Leveraged/inverse products (e.g. UBOT) are deliberately excluded, consistent
# with the other USA config files. BOTZ lives here (not in etfs_usa.yaml) --
# a ticker can only belong to one market at a time since the etfs table keys
# on ticker alone.
#
# Data Center Infrastructure (SRVR, DTCR) is the closest available ETF proxy
# for server racks and data-center networking/cabling -- no ETF tracks racks
# or cabling specifically, so this is a broader digital-infrastructure fund
# pair, not a pure-play. Everything else here is a direct thematic match.

- ticker: BOTZ
  name: Global X Robotics & Artificial Intelligence ETF
  sector: Robotics & Automation

- ticker: ROBO
  name: ROBO Global Robotics and Automation Index ETF
  sector: Robotics & Automation

- ticker: ARKQ
  name: ARK Autonomous Technology & Robotics ETF
  sector: Robotics & Automation

- ticker: IRBO

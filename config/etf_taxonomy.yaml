# Top-down classification of the full NSE India ETF universe: Asset Class ->
# Category -> Sector/Theme. Based on NSE Indices' published index categories
# (broad market, sectoral, thematic, strategy/factor, fixed income) as of 2026-08.
#
# `tracked_sector`, when set, must match a `sector` value in config/etfs.yaml or
# config/social_trending_etfs.yaml exactly — the dashboard uses it to filter the
# returns tables when this leaf is clicked. Leave it blank/omitted for
# sectors/themes not yet in the tracker.


# Curated snapshot of India NSE ETFs frequently discussed by retail investors on
# social media (YouTube finance channels, X/Twitter finance accounts, Facebook
# investing groups) as of 2026-08. This is a MANUAL, periodically-refreshed list —
# there is no free API for cross-platform social mention counts, so it is not
# live-scraped. Re-research and update this file occasionally to keep it current.
#
# ticker must match the yfinance symbol (NSE tickers use the ".NS" suffix).

- ticker: NIFTYBEES.NS
  name: Nippon India ETF Nifty BeES
  sector: Broad Market
  note: Most widely recommended ETF for beginner SIPs across finance YouTube/X

- ticker: GOLDBEES.NS
  name: Nippon India ETF Gold BeES
  sector: Gold
  note: Heavily discussed as a gold-hedge alternative to physical gold

- ticker: SILVERBEES.NS

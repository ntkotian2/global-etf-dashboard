# Top-down classification of the Canada (TSX) ETF universe: Asset Class ->
# Category -> Sector/Theme. Canada's ETF market is much smaller/less diverse
# than the US or India -- three leaves (Quality, Telecom, Consumer) stay
# untracked/gray because no direct TSX-listed ETF product could be found for
# them, rather than forcing a bad-fit substitution.
#
# `tracked_sector`, when set, must match a `sector` value in
# config/etfs_canada.yaml exactly -- the dashboard uses it to filter the
# returns table when this leaf is clicked. Leave it blank/omitted for
# sectors/themes not yet in the tracker.

- level1: Equity
  level2: Broad Market
  leaf: TSX 60
  tracked_sector: Broad Market (TSX 60)
- level1: Equity
  level2: Broad Market
  leaf: TSX Composite
  tracked_sector: Broad Market (TSX Composite)

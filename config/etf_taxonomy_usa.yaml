# Top-down classification of the US ETF universe: Asset Class -> Category ->
# Sector/Theme. Based on standard US ETF categorization (GICS 11 sectors,
# style-box/factor investing, bond market segments, international regions).
#
# `tracked_sector`, when set, must match a `sector` value in
# config/etfs_usa.yaml exactly -- the dashboard uses it to filter the returns
# table when this leaf is clicked. Leave it blank/omitted for sectors/themes
# not yet in the tracker.


name: Daily ETF price refresh

# $0 data pipeline: GitHub Actions (free, unlimited minutes on public repos)
# pulls the latest prices via yfinance once a day and commits data/prices.csv.
# The Streamlit dashboard and the Render API both read that committed file --
# neither fetches from Yahoo at request time anymore (datacenter IPs get
# rate-limited, which used to 500 every endpoint).

on:
  schedule:
    # 21:30 UTC daily -- after NSE (~10:00 UTC) and NYSE (~20:00 UTC) close
    - cron: "30 21 * * *"
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh price history
        run: python scripts/daily_refresh.py

      - name: Commit updated prices.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || git commit -m "Daily ETF price refresh ($(date -u +%Y-%m-%d))"
          git push
